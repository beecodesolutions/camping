AWSTemplateFormatVersion: '2010-09-09'
Description: Bootstrap only. Restricted GitHub OIDC and CloudFormation roles for the existing production stack.
Parameters:
  OidcProviderArn:
    Type: String
    Description: Existing account OIDC provider for token.actions.githubusercontent.com, audience sts.amazonaws.com
  ApiFunctionName:
    Type: String
    AllowedPattern: 'camping-production-Api-[a-zA-Z0-9]+'
  ApiExecutionRoleName:
    Type: String
    AllowedPattern: 'camping-production-ApiRole-[a-zA-Z0-9]+'
  HttpApiId:
    Type: String
    AllowedPattern: '[a-z0-9]+'
  CurrentArtifactKey:
    Type: String
    Description: Existing Lambda S3 object key, retained for rollback of the first CI deployment
    AllowedPattern: '(api|production)/[a-zA-Z0-9/_-]+'
  DatabaseSecretArn:
    Type: String
    AllowedPattern: 'arn:aws:secretsmanager:us-east-1:048834125079:secret:camping/production/database-.+'
Resources:
  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref OidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: repo:beecodesolutions/camping:environment:Production
      Policies:
        - PolicyName: ExistingProductionDeployment
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:us-east-1:${AWS::AccountId}:stack/camping-production/*
                  - !Sub arn:${AWS::Partition}:cloudformation:us-east-1:${AWS::AccountId}:changeSet/github-*/*
              - Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub arn:${AWS::Partition}:cloudformation:us-east-1:aws:transform/Serverless-2016-10-31
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              - Effect: Allow
                Action: s3:GetBucketLocation
                Resource: arn:aws:s3:::camping-deploy-048834125079-us-east-1
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: arn:aws:s3:::camping-deploy-048834125079-us-east-1/production/*
  CloudFormationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: UpdateExistingProductionResources
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:GetFunctionCodeSigningConfig
                  - lambda:GetFunctionRecursionConfig
                  - lambda:GetRuntimeManagementConfig
                  - lambda:GetFunctionScalingConfig
                  - lambda:PutRuntimeManagementConfig
                  - lambda:PutFunctionRecursionConfig
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:PutFunctionConcurrency
                  - lambda:DeleteFunctionConcurrency
                  - lambda:ListTags
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:GetPolicy
                  - lambda:AddPermission
                  - lambda:RemovePermission
                Resource: !Sub arn:${AWS::Partition}:lambda:us-east-1:${AWS::AccountId}:function:${ApiFunctionName}
              - Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:TagRole
                  - iam:UntagRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ApiExecutionRoleName}
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ApiExecutionRoleName}
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              - Effect: Allow
                Action:
                  [
                    apigateway:GET,
                    apigateway:PATCH,
                    apigateway:POST,
                    apigateway:PUT,
                    apigateway:DELETE,
                  ]
                Resource:
                  - !Sub arn:${AWS::Partition}:apigateway:us-east-1::/apis/${HttpApiId}
                  - !Sub arn:${AWS::Partition}:apigateway:us-east-1::/apis/${HttpApiId}/*
              - Effect: Allow
                Action: [logs:DescribeLogGroups, logs:DescribeResourcePolicies]
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:RequestedRegion: us-east-1
              - Effect: Allow
                Action:
                  [
                    logs:GetDataProtectionPolicy,
                    logs:DescribeIndexPolicies,
                    logs:PutRetentionPolicy,
                    logs:DeleteRetentionPolicy,
                    logs:ListTagsForResource,
                    logs:TagResource,
                    logs:UntagResource,
                  ]
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:us-east-1:${AWS::AccountId}:log-group:/aws/lambda/${ApiFunctionName}
                  - !Sub arn:${AWS::Partition}:logs:us-east-1:${AWS::AccountId}:log-group:/aws/lambda/${ApiFunctionName}:*
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - arn:aws:s3:::camping-deploy-048834125079-us-east-1/production/*
                  - !Sub arn:aws:s3:::camping-deploy-048834125079-us-east-1/${CurrentArtifactKey}
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DatabaseSecretArn
Outputs:
  AWSDeployRoleArn:
    Value: !GetAtt GitHubDeployRole.Arn
  CFExecutionRoleArn:
    Value: !GetAtt CloudFormationRole.Arn
