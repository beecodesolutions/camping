name: Production API

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: camping-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: Production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_PAGER: ''
      STACK_NAME: camping-production
      DEPLOY_BUCKET: camping-deploy-048834125079-us-east-1
      CF_EXECUTION_ROLE_ARN: ${{ vars.CF_EXECUTION_ROLE_ARN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test deployment safeguards without production access
        run: node --test scripts/test-production-delivery.cjs
      - name: Package and verify Lambda
        run: pnpm package:lambda
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: camping-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: us-east-1
          allowed-account-ids: '048834125079'
      - name: Check existing production stack and retain parameters
        run: bash scripts/production-stack.sh prepare
      - name: Migrate and provision production runtime
        env:
          DATABASE_ADMIN_URL: ${{ secrets.SUPABASE_ADMIN_URL }}
          DATABASE_SSL: 'true'
          DATABASE_RUNTIME_ROLE: camping_runtime
          NODE_ENV: production
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/api/certs/supabase-ca.crt
        run: |
          node scripts/check-production-database.cjs
          pnpm db:migrate
          pnpm runtime:provision
      - name: Publish immutable Lambda and template
        run: |
          aws cloudformation package --template-file infra/template.yaml \
            --s3-bucket "$DEPLOY_BUCKET" --s3-prefix "production/$GITHUB_SHA" \
            --output-template-file .artifacts/production.yaml
      - name: Retain deployment evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .artifacts/lambda.zip
            .artifacts/production.yaml
            .artifacts/production-parameters.json
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
      - name: Deploy existing production stack
        run: bash scripts/production-stack.sh deploy
      - name: Verify stack and public API
        run: bash scripts/production-stack.sh verify
